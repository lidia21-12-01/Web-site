<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OFFICE SHIFT 3D · LIVE</title><style>:root{--bg:#071019;--panel:#0b1824e8;--line:#203e52;--cyan:#6fe3ff;--green:#7cffbd;--text:#eef8ff;--muted:#91aebe}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:15px/1.45 Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 12% 8%,#1b527744,transparent 30%),radial-gradient(circle at 88% 6%,#6454cc33,transparent 28%),linear-gradient(#08141f,#06111b)}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:24px;letter-spacing:.15em}.brand span,.score{color:var(--cyan)}.live{color:var(--green);font-weight:800}.panel{margin-top:18px;background:var(--panel);border:1px solid #1c394d;border-radius:22px;box-shadow:0 24px 70px #0007;padding:22px}.ey{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}h1{font-size:40px;margin:8px 0 4px}.muted{color:var(--muted)}.row{display:grid;grid-template-columns:70px 1.2fr 110px repeat(4,82px) 110px;gap:10px;align-items:center;padding:13px 14px;border:1px solid #1d3d52;background:#091722;border-radius:15px;margin-top:9px}.place{font-size:23px;font-weight:900}.nick{font-weight:800;font-size:18px}.score{text-align:right;font-size:25px;font-weight:900}.metric{text-align:center}.metric small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.metric b{font-size:17px}.status{text-align:right;color:#c7d9e2;font-size:13px}@media(max-width:900px){.row{grid-template-columns:55px 1fr 90px 95px}.metric{display:none}}</style></head><body><main class="wrap"><header class="top"><div class="brand">OFFICE <span>SHIFT 3D</span></div><div id="live" class="live">● LIVE</div></header><section class="panel"><div class="ey">Таблица результатов</div><h1>Рабочая смена</h1><p class="muted">Рейтинг обновляется после завершения каждого задания. Скорость прохождения не используется как основной критерий.</p><div id="board"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>let sb;async function init(){const c=await fetch('https://tzjflwayarzcrwtvcyqo.supabase.co/functions/v1/office-config',{cache:'no-store'}).then(r=>r.json());sb=supabase.createClient(c.url,c.key);await load();sb.channel('office-board').on('postgres_changes',{event:'*',schema:'public',table:'office_players'},load).subscribe(s=>live.textContent=s==='SUBSCRIBED'?'● LIVE':'● '+s)}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const {data,error}=await sb.from('office_players').select('nickname,score,analysis,sources,risk,efficiency,completed_tasks,status').eq('session_code','OFFICE01').order('score',{ascending:false});if(error){board.innerHTML='<p>Ошибка загрузки.</p>';return}const medals=['🥇','🥈','🥉'];board.innerHTML=(data||[]).map((p,i)=>`<div class="row"><div class="place">${medals[i]||i+1}</div><div><div class="nick">${esc(p.nickname)}</div><div class="muted">заданий ${p.completed_tasks}/8</div></div><div class="score">${p.score}</div><div class="metric"><small>Анализ</small><b>${p.analysis}</b></div><div class="metric"><small>Источники</small><b>${p.sources}</b></div><div class="metric"><small>Риск</small><b>${p.risk}</b></div><div class="metric"><small>Эффект.</small><b>${p.efficiency}</b></div><div class="status">${esc(p.status)}</div></div>`).join('')||'<p class="muted">Ожидание подключения участников…</p>'}init();</script></body></html>
